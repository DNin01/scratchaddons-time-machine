<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Addons Time Machine - Settings Page (loading)</title>
    <script src="settings-pages.js" type="module"></script>
  </head>
  <body>
    <header>
      <span>Settings page - Scratch Addons Time Machine</span>
      <select title="Select a settings page version" disabled>
        <option value="1.11.1">v1.11.1</option>
        <option value="1.10.0">v1.10.0</option>
        <option value="1.9.1">v1.9.1</option>
        <option value="1.8.0">v1.8.0</option>
        <option value="1.7.1">v1.7.0</option>
        <option value="1.6.1">v1.6.1</option>
        <option value="1.5.1">v1.5.0</option>
        <option value="1.4.0">v1.4.0</option>
        <option value="1.3.1">v1.3.1</option>
        <option value="1.2.1">v1.2.1</option>
        <option value="1.1.1">v1.1.1</option>
        <option value="1.0.0">v1.0.0</option>
      </select>
    </header>
    <iframe></iframe>
  </body>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      margin: 20px;
    }

    header {
      border: 1px solid #333;
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
      background: #000;
      height: 40px;
      padding: 7px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-content: center;
    }

    header > span {
      align-content: center;
      margin-left: 4px;
      font-size: 14px;
    }

    header > select {
      border: none;
      font-size: 16px;
      transition: 0.2s;
    }

    select:is(:disabled, :not(:hover, :focus-visible)) {
      background: none;
      color: #aaa;
    }

    iframe {
      background: #222;
      border: 1px solid #333;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      width: 100%;
      height: calc(100vh - 80px);
      vertical-align: top;
    }
  </style>
</html>
